<!DOCTYPE html>
<html>

<head>
    <title>Moto Store</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }

        #phoneList {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
            width: 250px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        #cart {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            width: 250px;
            text-align: left;
        }

        #searchBox {
            padding: 8px;
            width: 300px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>📱 Motorola Phone Store</h1>

    <input
        type="text"
        id="searchBox"
        placeholder="Search by name or color..."
        onkeyup="searchPhones()"
    >

    <br>

    <button onclick="loadPhones()">Load Phones</button>

    <div id="cart">
        <b>
            Cart:
            <span id="cartCount">0</span>
            items |
            Total: ₹<span id="cartTotal">0</span>
        </b>

        <div id="cartItems"></div>
    </div>

    <div id="phoneList"></div>

    <script src="script.js"></script>

</body>

</html>
