<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

    <button type="button" class="btn btn-primary">Primary</button> <!-- Blue Color -->

    <button type="button" class="btn btn-secondary">Secondary</button> <!-- Black Color -->

    <button type="button" class="btn btn-success">Success</button> <!-- Green Color -->

    <button type="button" class="btn btn-danger">Danger</button> <!-- Red Color -->

    <button type="button" class="btn btn-warning">Warning</button> <!-- Yellow Color -->

    <button type="button" class="btn btn-info">Info</button> <!-- Blue Color -->

    <button type="button" class="btn btn-light">Light</button> <!-- White Color -->

    <button type="button" class="btn btn-dark">Dark</button> <!-- Black Color -->

    <button type="button" class="btn btn-link">Link</button>

    <button type="button" class="btn-close" aria-label="Close"></button>

</body>

</html>
